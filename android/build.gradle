buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// react-native-audio-api downloads prebuilt binaries with Git Bash on Windows, but starts bash.exe
// without Git's tools (mkdir, curl, unzip, rm) on PATH, so the script fails. Prepend them here.
subprojects { sub ->
    if (sub.name == "react-native-audio-api" && System.getProperty("os.name").toLowerCase().contains("windows")) {
        sub.tasks.matching { it.name == "downloadPrebuiltBinaries" }.configureEach { task ->
            def git = new File(System.getenv("ProgramFiles") ?: "C:/Program Files", "Git")
            def gitTools = [new File(git, "usr/bin").path, new File(git, "mingw64/bin").path]
            def pathKey = task.environment.keySet().find { it.equalsIgnoreCase("PATH") } ?: "PATH"
            def current = task.environment[pathKey] ?: System.getenv("PATH") ?: ""
            task.environment(pathKey, (gitTools + [current]).join(File.pathSeparator))
        }

        // Its native build nests the full source path under .cxx/RelWithDebInfo/<hash>/<abi>/..., which
        // overflows Windows' 260-char path limit in release builds. Build it in a shorter folder instead.
        sub.plugins.withId("com.android.library") {
            sub.android.externalNativeBuild.cmake.buildStagingDirectory = new File(rootProject.projectDir, ".cxx-audio")
        }
    }
}
